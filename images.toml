# The stock images, one [[image]] each. scripts/build.sh builds them,
# tests/ checks them, CI publishes them as ghcr.io/ghostrack-io/<name>:<version>.
#
#   name          the package name on GHCR
#   version       the distribution's version, the image's tag
#   display_name  the name people read
#   family        images/<family>/Containerfile builds it
#   init          systemd or openrc
#   stop_signal   the signal on which the image's init shuts down, as a
#                 number: 37 (SIGRTMIN+3) for systemd, 12 (SIGUSR2) for
#                 busybox init running OpenRC
#   base          the official image, by tag and digest; scripts/update-bases.sh
#                 moves the digests (and a released Alpine's version to its current release)
#   minimum_memory_bytes
#                 the smallest memory an instance of the image is given: its
#                 package manager works and its timers' services run in it
#                 (dnf on EL 9 needs more than 256 MiB without swap)
#   x86_64_level  the x86-64 microarchitecture level the distribution is
#                 built for, which the host's CPU must have: 1 (baseline),
#                 2 (x86-64-v2: SSE4.2, POPCNT) or 3 (x86-64-v3: AVX2, BMI2,
#                 FMA, MOVBE); the image's init dies on a CPU without it

[[image]]
name = "debian"
version = "13"
display_name = "Debian 13"
family = "debian"
init = "systemd"
stop_signal = 37
base = "docker.io/library/debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
minimum_memory_bytes = 268_435_456 # 256 MiB
x86_64_level = 1

